- insert:
    - id: xiaolian-session-archive
      name: 'dsh-session-archive'
      config:
        # 目标工作区（留空就用当前进程 cwd；非本机请留空）
        workspace: ''
        # 不填默认 ~/.dsh/sessions
        sessionsRoot: ''
        # read/digest 默认最多回多少条
        maxTail: 80
        # 新会话开场时，从这些目录里摘「还欠着的事」（相对 workspace；不存在就跳过）
        handoffDirs: ['state/handoff']
        # 摘最新几份、每份最多几行
        handoffFiles: 2
        handoffLines: 6
